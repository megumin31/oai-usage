name: Update OpenAI prices

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'megumin31/oai-usage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Read and validate official Standard prices
        run: python3 scripts/update_prices.py --output candidate/prices.json
      - name: Verify calculator and price sync
        run: python3 -m unittest discover -s tests -q
        env:
          OAI_USAGE_OFFLINE_PRICES: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-candidate
          path: candidate/prices.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    if: github.repository == 'megumin31/oai-usage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: price-candidate
          path: candidate
      - name: Revalidate candidate using trusted code
        run: python3 scripts/update_prices.py --validate candidate/prices.json
      - name: Publish only prices.json if main still matches this run
        run: python3 scripts/publish_prices.py
        env:
          GH_TOKEN: ${{ github.token }}
